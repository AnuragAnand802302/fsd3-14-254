
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */

        header {
            padding: 18px 25px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #202124;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .right-nav {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .apps {
            font-size: 20px;
            cursor: pointer;
        }

        .sign-in {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .sign-in:hover {
            background-color: #1765c1;
        }

        /* Main */

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 120px;
        }

        /* Google Logo */

        .logo {
            font-size: 90px;
            font-weight: bold;
            letter-spacing: -8px;
            margin-bottom: 30px;
        }

        .blue {
            color: #4285f4;
        }

        .red {
            color: #ea4335;
        }

        .yellow {
            color: #fbbc05;
        }

        .green {
            color: #34a853;
        }

        /* Search Box */

        .search-box {
            width: 580px;
            height: 46px;
            border: 1px solid #dfe1e5;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.25);
        }

        .search-icon {
            color: #777;
            font-size: 25px;
            margin-right: 10px;
        }

        .search-box input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 18px;
        }

        .mic {
            cursor: pointer;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .buttons button {
            padding: 10px 18px;
            border: 1px solid #f8f9fa;
            background-color: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .buttons button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }

        /* Languages */

        .language {
            margin-top: 28px;
            font-size: 13px;
        }

        .language a {
            text-decoration: none;
            margin-left: 10px;
            color: #1a0dab;
        }

        .language a:hover {
            text-decoration: underline;
        }

        /* Footer */

        footer {
            background-color: #f2f2f2;
            color: #5f6368;
            font-size: 14px;
        }

        .country {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
        }

        .footer-links {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
        }

        .footer-links a {
            text-decoration: none;
            color: #5f6368;
            margin-right: 25px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <nav>

            <a href="about.html">About us</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="index.html">Home</a>
            <a href="#">Store</a>

            <div class="right-nav">
                <a href="#">Gmail</a>
                <a href="#">Images</a>

                <span class="apps">⋮⋮⋮</span>

                <button class="sign-in">
                    Sign in
                </button>
            </div>

        </nav>
    </header>


    <main>

        <div class="logo">
            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>
        </div>


        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input type="text">

            <span class="mic">
                🎙️
            </span>

        </div>


        <div class="buttons">

            <button>
                Google Search
            </button>

            <button>
                I'm Feeling Lucky
            </button>

        </div>


        <p class="language">

            Google offered in:

            <a href="#">हिन्दी</a>
            <a href="#">বাংলা</a>
            <a href="#">తెలుగు</a>
            <a href="#">मराठी</a>
            <a href="#">தமிழ்</a>

        </p>

    </main>


    <footer>

        <div class="country">
            India
        </div>

        <div class="footer-links">

            <div>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>

            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>

        </div>

    </footer>

</body>
</html>
